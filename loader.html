<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wellfind Perfect Circular Loader</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
    }

    .loader-wrapper {
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>

  <div class="loader-wrapper">
    <svg viewBox="0 0 220 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- 1. Magnifying Glass Handle -->
      <line x1="142" y1="142" x2="188" y2="188" stroke="#00897B" stroke-width="26" stroke-linecap="round" />
      <line x1="135" y1="135" x2="152" y2="152" stroke="#00897B" stroke-width="10" />

      <!-- 2. Main Teal Lens Ring (Center: cx=95, cy=95, r=66) -->
      <circle cx="95" cy="95" r="66" fill="#ffffff" stroke="#00897B" stroke-width="11" />

      <!-- 3. Inner Figures (Mentor + Student with Cap) -->
      <g>
        <!-- Mentor (Dark Navy) -->
        <circle cx="77" cy="67" r="16" fill="#0A1D42" />
        <path d="M 45 103 C 45 86, 62 84, 73 86 L 98 111 L 84 128 C 72 138, 45 125, 45 103 Z" fill="#0A1D42" />

        <!-- Student (Slate Blue) -->
        <circle cx="111" cy="95" r="13" fill="#53627A" />
        <path d="M 85 126 C 85 112, 102 108, 114 111 C 127 114, 130 128, 121 138 C 110 148, 85 142, 85 126 Z" fill="#53627A" stroke="#ffffff" stroke-width="3" />

        <!-- Graduation Cap -->
        <polygon points="96,74 117,69 135,80 114,85" fill="#00897B" />
        <path d="M 103 78 L 103 84 C 103 84, 114 88, 124 83 L 124 78 Z" fill="#00897B" />
        <line x1="131" y1="79" x2="131" y2="93" stroke="#00897B" stroke-width="2.2" />
        <circle cx="131" cy="94" r="2.5" fill="#00897B" />
        <path d="M 127 101 L 135 101 L 133 95 L 129 95 Z" fill="#00897B" />
      </g>

      <!-- 4. Faint Track Circle (Optional subtle guide track) -->
      <circle cx="95" cy="95" r="78" fill="none" stroke="#0A1D42" stroke-opacity="0.1" stroke-width="4.5" />

      <!-- 5. Exact Concentric Rotating Arc (Same center cx=95, cy=95, radius=78) -->
      <!-- Circumference = 2 * π * 78 ≈ 490 -->
      <circle
        cx="95"
        cy="95"
        r="78"
        fill="none"
        stroke="#0A1D42"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-dasharray="140 350"
      >
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 95 95"
          to="360 95 95"
          dur="1.1s"
          repeatCount="indefinite"
        />
      </circle>
    </svg>
  </div>

</body>
</html>
