<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixed SVG Alert Labels</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .banner-box {
      width: 100%;
      max-width: 860px;
    }
  </style>
</head>
<body>

  <!-- 1. SUCCESS BANNER (Light Green) -->
  <div class="banner-box">
    <svg viewBox="0 0 860 76" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="858" height="74" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <g transform="translate(20, 18)" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9" r="7.5" />
        <path d="M 6 9.2 L 8 11.2 L 12.2 7" />
      </g>
      <foreignObject x="48" y="14" width="790" height="50">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; padding-right: 16px;">
          <div style="color: #14532D; font-size: 13.5px; font-weight: 700; line-height: 1.3; margin-bottom: 4px;">
            Razorpay connected (live mode). Webhook active
          </div>
          <div style="color: #166534; font-size: 12.5px; font-weight: 400; line-height: 1.4;">
            Payments and webhook events are verified and syncing automatically in real time.
          </div>
        </div>
      </foreignObject>
    </svg>
  </div>

  <!-- 2. ERROR BANNER (Light Red) -->
  <div class="banner-box">
    <svg viewBox="0 0 860 76" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="858" height="74" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
      <g transform="translate(20, 18)" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9" r="7.5" />
        <line x1="9" y1="5.8" x2="9" y2="9.5" />
        <circle cx="9" cy="12.2" r="0.6" fill="#DC2626" />
      </g>
      <foreignObject x="48" y="14" width="790" height="50">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; padding-right: 16px;">
          <div style="color: #7F1D1D; font-size: 13.5px; font-weight: 700; line-height: 1.3; margin-bottom: 4px;">
            Razorpay connection failed. Invalid API keys
          </div>
          <div style="color: #991B1B; font-size: 12.5px; font-weight: 400; line-height: 1.4;">
            Check your RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET in environment variables and try again.
          </div>
        </div>
      </foreignObject>
    </svg>
  </div>

  <!-- 3. WARNING BANNER (Light Orange - Fixed Right Padding) -->
  <div class="banner-box">
    <svg viewBox="0 0 860 76" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="858" height="74" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2" />
      <g transform="translate(20, 19)" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="2" width="16" height="12" rx="2" />
        <line x1="1" y1="6.5" x2="17" y2="6.5" />
        <line x1="4" y1="10.5" x2="7" y2="10.5" />
      </g>
      <foreignObject x="48" y="14" width="790" height="52">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; padding-right: 16px;">
          <div style="color: #1E293B; font-size: 13.5px; font-weight: 700; line-height: 1.3; margin-bottom: 4px;">
            Razorpay connected (test mode). Webhook not set
          </div>
          <div style="color: #64748B; font-size: 12.5px; font-weight: 400; line-height: 1.4;">
            Add RAZORPAY_WEBHOOK_SECRET and create the webhook in the Razorpay dashboard so payments confirm even if the teacher closes the page.
          </div>
        </div>
      </foreignObject>
    </svg>
  </div>

</body>
</html>
